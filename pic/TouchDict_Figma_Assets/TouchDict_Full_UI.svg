<svg xmlns="http://www.w3.org/2000/svg" width="1414" height="1058" viewBox="0 0 1414 1058">

<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6C8AB8" flood-opacity="0.12"/>
  </filter>
</defs>


<rect width="1414" height="1058" rx="18" fill="#F7F9FC"/>
<rect x="1" y="1" width="1412" height="1056" rx="17" fill="none" stroke="#CBD5E1"/>

<!-- top window area -->
<rect x="0" y="0" width="1414" height="48" rx="18" fill="#FAFBFD"/>
<line x1="0" y1="48" x2="1414" y2="48" stroke="#E8EDF5"/>
<g stroke="#111827" stroke-width="2" stroke-linecap="round">
  <line x1="1230" y1="25" x2="1246" y2="25"/>
  <rect x="1296" y="18" width="14" height="14" rx="2" fill="none"/>
  <line x1="1369" y1="18" x2="1383" y2="32"/>
  <line x1="1383" y1="18" x2="1369" y2="32"/>
</g>

<!-- full-width search bar -->
<g filter="url(#shadow)">
  <rect x="34" y="78" width="1346" height="80" rx="24" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
</g>
<g transform="translate(62 102)">
<circle cx="14" cy="14" r="9" fill="none" stroke="#66758D" stroke-width="2.4"/>
<line x1="20.5" y1="20.5" x2="27" y2="27" stroke="#66758D" stroke-width="2.4" stroke-linecap="round"/>
</g>
<text x="118" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#12213A">thrown</text>
<rect x="1228" y="88" width="140" height="60" rx="18" fill="#2F6BFF"/>
<text x="1298" y="126" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">查询</text>

<!-- left sidebar -->
<rect x="0" y="176" width="302" height="882" fill="#FBFCFE"/>
<line x1="302" y1="176" x2="302" y2="1058" stroke="#E8EDF5"/>
<rect x="30" y="190" width="258" height="64" rx="14" fill="#EAF1FF"/>
<text x="48" y="231" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" fill="#2F6BFF">thrown</text>
<text x="48" y="306" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">Annual</text>
<text x="48" y="374" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">bazillion</text>
<text x="48" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">threshold</text>
<text x="48" y="510" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">threw together</text>
<text x="48" y="578" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">threw</text>
<text x="48" y="646" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">prompt</text>
<text x="48" y="714" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">crusty</text>
<text x="48" y="782" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#4F607B">spit out</text>

<!-- main surface -->
<rect x="324" y="188" width="1060" height="830" rx="22" fill="#FFFFFF"/>
<text x="356" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#12213A">thrown</text>
<text x="358" y="345" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#7A8AA3">phr.</text>

<!-- definition card -->
<rect x="356" y="382" width="1000" height="160" rx="18" fill="#F8FBFF" stroke="#D6E3F6"/>
<text x="390" y="430" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#2F6BFF">释义</text>
<text x="390" y="490" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" fill="#12213A">猫被扔进了篮子中</text>

<!-- example card -->
<rect x="356" y="568" width="1000" height="242" rx="18" fill="#FFFFFF" stroke="#DCE5F2"/>
<text x="390" y="616" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#A14DF0">例句</text>
<text x="390" y="676" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" fill="#12213A">The cat is thrown into the basket.</text>
<line x1="390" y1="710" x2="1320" y2="710" stroke="#E8EDF5"/>
<text x="390" y="764" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#6F7F99">猫被扔进了篮子里。</text>

<!-- bottom actions -->
<rect x="346" y="862" width="1020" height="118" rx="20" fill="#FFFFFF" stroke="#EEF2F7"/>
<rect x="364" y="882" width="166" height="76" rx="16" fill="#F6F9FF" stroke="#DCE5F2"/>
<g transform="translate(390 904)">{speaker_icon}</g>
<text x="448" y="930" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#31415C">发音</text>

<rect x="544" y="882" width="166" height="76" rx="16" fill="#FFFFFF" stroke="#DCE5F2"/>
<g transform="translate(570 904)">{pin_icon}</g>
<text x="628" y="930" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#31415C">固顶</text>

<rect x="1184" y="882" width="158" height="76" rx="16" fill="#FFFFFF" stroke="#DCE5F2"/>
<g transform="translate(1208 904)">{retry_icon}</g>
<text x="1262" y="930" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#31415C">重试</text>

</svg>